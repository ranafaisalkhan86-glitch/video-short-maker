<!DOCTYPE html>
<html>
<head>

<title>Video Short Maker</title>

<style>

body{
background:#111827;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
width:400px;
background:#1e293b;
padding:20px;
border-radius:10px;
text-align:center;
}

input{
width:100%;
padding:10px;
margin-top:10px;
}

button{
margin-top:15px;
padding:10px 20px;
background:blue;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box">

<h1>Video Short Maker</h1>

<input
type="text"
id="videoUrl"
placeholder="Paste Video URL"
/>

<button onclick="sendVideo()">
Generate Clip
</button>

<p id="status"></p>

</div>

<script>

async function sendVideo(){

const videoUrl =
document.getElementById('videoUrl').value;

const response = await fetch(
'https://YOUR-RENDER-URL.onrender.com/clip',
{

method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify({
videoUrl
})

});

const data = await response.json();

document.getElementById('status')
.innerText = data.message;

}

</script>

</body>
</html>S
